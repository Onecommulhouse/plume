name: Plume

options:
  bundleIdPrefix: com.onecom
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    DEAD_CODE_STRIPPING: YES

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.0

targets:
  Plume:
    type: application
    platform: macOS
    sources:
      - path: Plume
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    info:
      path: Plume/Info.plist
      properties:
        CFBundleName: Plume
        CFBundleDisplayName: Plume
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 ONE COM"
        NSMicrophoneUsageDescription: "Plume écoute ta voix uniquement pendant que tu maintiens le raccourci, pour la transformer en texte sur ton Mac."
    entitlements:
      path: Plume/Plume.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onecom.plume
        PRODUCT_NAME: Plume
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
