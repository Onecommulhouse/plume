name: Plume

options:
  bundleIdPrefix: com.onecom
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    DEAD_CODE_STRIPPING: YES
    # Pas d'autorisation de débogage (get-task-allow) : Apple la refuse à la notarisation.
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

targets:
  Plume:
    type: application
    platform: macOS
    sources:
      - path: Plume
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: Sparkle
        product: Sparkle
    info:
      path: Plume/Info.plist
      properties:
        CFBundleName: Plume
        CFBundleDisplayName: Plume
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 ONE COM"
        NSMicrophoneUsageDescription: "Plume écoute ta voix uniquement pendant que tu maintiens le raccourci, pour la transformer en texte sur ton Mac."
        # Mises à jour automatiques (Sparkle) : liste des versions publiée à chaque compilation sur GitHub.
        SUFeedURL: "https://github.com/Onecommulhouse/plume/releases/latest/download/appcast.xml"
        # Clé publique : seules les mises à jour signées avec la clé privée (secret SPARKLE_PRIVATE_KEY) sont acceptées.
        SUPublicEDKey: "ESaY2/JjjFi6PO5MQhm4txxBKngZRHLAaYxNHirPWW8="
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 3600
    entitlements:
      path: Plume/Plume.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onecom.plume
        PRODUCT_NAME: Plume
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
