name: Compiler Plume

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Identifiants de la clé de notarisation App Store Connect (pas secrets : inutiles sans le fichier .p8).
env:
  NOTARY_KEY_ID: "3AM7C249ZD"
  NOTARY_ISSUER_ID: "52265117-add4-407c-b7ff-9e2ada3a1e4d"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: |
          sw_vers
          xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Cache des paquets Swift
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}

      # Signature Developer ID : activée seulement quand les secrets Apple sont renseignés.
      - name: Certificat Apple
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "Pas de certificat Apple : version de test non signée."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/plume.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN" > /dev/null
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"$/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::Le fichier .p12 ne contient pas de certificat « Developer ID Application »."
            exit 1
          fi
          # Le Team ID figure entre parenthèses à la fin du nom du certificat.
          TEAM_ID=$(printf '%s' "$IDENTITY" | sed -nE 's/.*\(([A-Z0-9]{10})\)$/\1/p')
          if [ -z "$TEAM_ID" ]; then
            echo "::error::Impossible de lire le Team ID dans « $IDENTITY »."
            exit 1
          fi
          echo "Signature avec : $IDENTITY (équipe $TEAM_ID)"
          {
            echo "enabled=true"
            echo "identity=$IDENTITY"
            echo "team=$TEAM_ID"
            echo "keychain=$KEYCHAIN"
          } >> "$GITHUB_OUTPUT"

      - name: Compiler
        env:
          APPLE_TEAM_ID: ${{ steps.signing.outputs.team }}
          SIGNING: ${{ steps.signing.outputs.enabled }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          if [ "$SIGNING" = "true" ]; then
            SIGN_ARGS=(CODE_SIGN_IDENTITY="$IDENTITY" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN")
          else
            SIGN_ARGS=(CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" CODE_SIGN_STYLE=Manual)
          fi
          set +e
          xcodebuild \
            -project Plume.xcodeproj \
            -scheme Plume \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${SIGN_ARGS[@]}" \
            build > build.log 2>&1
          status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | head -80
          exit $status

      - name: Vérifier la signature
        run: |
          APP=build/Build/Products/Release/Plume.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier|flags" || true
          echo "Autorisations de l'app :"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p - || true
          if codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q "get-task-allow"; then
            echo "::error::L'app contient encore l'autorisation de débogage get-task-allow."
            exit 1
          fi

      - name: Clé de notarisation
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID || env.NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER || env.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::error::Clé de notarisation incomplète (fichier .p8, ID de clé ou Issuer ID manquant)."
            exit 1
          fi
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "Dernières soumissions à Apple :"
          xcrun notarytool history --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" 2>&1 | head -15 || true

      - name: Créer le fichier d'installation (.dmg)
        env:
          SIGNING: ${{ steps.signing.outputs.enabled }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          APP=build/Build/Products/Release/Plume.app
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Plume" -srcfolder "$STAGE" -ov -format UDZO Plume.dmg
          if [ "$SIGNING" = "true" ]; then
            codesign --sign "$IDENTITY" --timestamp Plume.dmg
          fi
          ls -lh Plume.dmg

      # Une seule soumission (le .dmg contient l'app). Si Apple met plus de 20 min, on publie quand même :
      # le fichier signé devient valide tout seul dès qu'Apple a terminé (vérification en ligne au premier lancement).
      - name: Notariser
        id: notary
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID || env.NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER || env.NOTARY_ISSUER_ID }}
        run: |
          set +e
          ./scripts/notarize.sh Plume.dmg 20m
          code=$?
          set -e
          case $code in
            0)
              xcrun stapler staple Plume.dmg
              spctl --assess --type open --context context:primary-signature --verbose=2 Plume.dmg || true
              echo "state=accepted" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "state=pending" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Publier l'app
        uses: actions/upload-artifact@v4
        with:
          name: Plume
          path: Plume.dmg
          retention-days: 30
          if-no-files-found: error

      - name: Journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Nettoyer le trousseau et la clé
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
